<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>한전넷 CMS</title>
    <link
      rel="stylesheet"
      href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"
    />
    <link href="/admin/cms-tui-editor.css?v=1" rel="stylesheet" />
    <link href="/admin/admin-custom.css?v=5" rel="stylesheet" />
    <link href="/admin/coupang.css?v=1" rel="stylesheet" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <script>
      window.CMS_MANUAL_INIT = true;
      try {
        localStorage.setItem("cms.preview-visible", "false");
      } catch (e) {}
      (function () {
        if (window.__decapDomPatch) return;
        window.__decapDomPatch = true;
        var origRemove = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode === this) {
            return origRemove.call(this, child);
          }
          return child;
        };
        var origInsert = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, ref) {
          try {
            return origInsert.call(this, newNode, ref);
          } catch (e) {
            if (e.name === "NotFoundError") return this.appendChild(newNode);
            throw e;
          }
        };
      })();
    </script>
  </head>
  <body>
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="https://uicdn.toast.com/editor/latest/i18n/ko-kr.min.js"></script>
    <script src="https://unpkg.com/decap-cms@3.4.0/dist/decap-cms.js"></script>
    <script src="/admin/cms-tui-editor.js?v=1"></script>
    <script>
      CMS.registerMediaLibrary({
        name: "r2",
        config: {},
        init({ handleInsert } = {}) {
          const input = document.createElement("input");
          input.type = "file";
          input.accept = "image/*";
          input.hidden = true;
          document.body.appendChild(input);

          input.addEventListener("change", async () => {
            const file = input.files && input.files[0];
            input.value = "";
            if (!file) return;

            const form = new FormData();
            form.append("file", file);

            try {
              const res = await fetch("/api/media", {
                method: "POST",
                body: form,
              });
              if (!res.ok) {
                alert("업로드 실패: " + (await res.text()));
                return;
              }
              const data = await res.json();
              handleInsert(data.url);
            } catch (err) {
              alert("업로드 오류: " + (err && err.message ? err.message : err));
            }
          });

          return {
            show() {
              input.click();
            },
            hide() {},
            enableStandalone() {
              return false;
            },
          };
        },
      });

      CMS.registerWidget("tui-markdown", window.TuiMarkdownControl, window.TuiMarkdownPreview);
      CMS.init();
    </script>
    <script src="/admin/cms-preview-default.js?v=2"></script>
    <script src="/admin/cms-post-publish-nav.js?v=1"></script>
    <script src="/admin/cms-blog-form-layout.js?v=2"></script>
    <script src="/admin/cms-tag-suggestions.js?v=1"></script>
    <script src="/admin/cms-branding.js?v=2"></script>
    <script src="/admin/cms-quick-links.js?v=1"></script>
    <script src="/admin/coupang-nav.js?v=3"></script>
    <script src="/admin/cms-sidebar-order.js?v=3"></script>
  </body>
</html>
